# Tool and task management for defold-mcp.

[tools]
python = "3.14.10"
uv = "0.13.7"

[tasks.setup]
description = "Create the uv virtualenv and install the package with dev extras."
run = "uv venv .venv --python 3.14 --clear && uv pip install -e \".[dev]\""

[tasks.test]
description = "Run the unit test suite (live tests excluded)."
depends = ["setup"]
run = ".venv/bin/pytest -m \"not live\" -q"

[tasks.live]
description = "Run the live Defold integration tests (downloads real artifacts, can take minutes)."
depends = ["setup"]
run = ".venv/bin/pytest -m live -v -s"

[tasks.handshake]
description = "Probe the MCP server over raw stdio JSON-RPC with a sanitised environment."
depends = ["setup"]
run = ".venv/bin/python scripts/mcp_handshake_test.py"
